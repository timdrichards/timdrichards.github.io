<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMPSCI 426 Scalable Web Systems</title>
  <!-- Import JetBrains Mono from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      margin: 2rem;
      background-color: #f9f9f9;
      color: #333;
      max-width: 60ch;
      width: 90%;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 0.05em;
    }

    h2 {
      margin-top: 0.05em;
    }

    code {
      background: #eee;
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 43ch }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .prompt {
      display: inline-block;
      overflow: hidden;
      border-right: 0.15em solid currentColor;
      white-space: nowrap;
      width: 43ch;
      animation: typing 4s steps(43), blink 1s step-end infinite;
    }
  </style>
</head>
<body>
    <h1>Scalable Web Systems</h1>
    <h2>COMPSCI 426</h2>
    <p><strong><div class="prompt">
      Spring 2025 material will be coming soon...
    </div></strong></p>
</body>
</html>
